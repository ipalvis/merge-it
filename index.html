<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Merge It!</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <div class="topbar">
        <div class="levels" id="levelSwitch" role="group" aria-label="Map"></div>
        <button id="resetBtn" class="iconbtn" aria-label="Reset" title="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
            <path d="M3.5 3.5v5h5" />
          </svg>
        </button>
        <button
          id="previewBtn"
          class="iconbtn preview"
          aria-pressed="false"
          aria-controls="mapPreview"
          aria-label="Show the finished map"
          title="Show or hide the finished map"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.6 9a3.5 3.5 0 1 1 5 3.2c-1 .5-1.6 1.3-1.6 2.3v.7" />
            <path d="M12 19.2v.1" />
          </svg>
        </button>
        <button id="muteBtn" class="soundbtn" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
          <svg class="on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M15.5 9a4.2 4.2 0 0 1 0 6" />
            <path d="M18.3 6.5a8 8 0 0 1 0 11" />
          </svg>
          <svg class="off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
        <button id="themeToggle" class="toggle" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="thumb">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="icon-cloud" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.5 19H8a5 5 0 1 1 1.1-9.9A6 6 0 0 1 20.5 11a4 4 0 0 1-3 8z" />
            </svg>
          </span>
        </button>
      </div>
      <header>
        <h1>Merge It!</h1>
        <button
          id="bankBtn"
          class="bank empty"
          disabled
          title="Tap, then tap a piece in the box or the current piece to bank it (once per round)"
        >
          <span class="bank-slot"><canvas id="bankCanvas" width="144" height="144" aria-hidden="true"></canvas></span>
          <span id="bankLabel">Bank</span>
        </button>
        <div class="next" aria-live="polite">
          <div><small>Next up</small><strong id="nextName">—</strong></div>
          <canvas id="nextCanvas" width="112" height="112" aria-hidden="true"></canvas>
        </div>
      </header>
      <div class="stats">
        <div class="stat"><small>Score</small><b id="score">0</b></div>
        <div class="stat"><small>Best</small><b id="best">0</b></div>
        <div class="stat"><small>Round</small><b id="round">1</b></div>
        <div class="stat"><small>Biggest piece</small><b id="biggest">0/48</b></div>
      </div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <div class="stage" id="stage">
        <div class="boxwrap" id="boxWrap">
          <canvas id="game" aria-label="Game box. Move to aim, click or tap to drop the piece."></canvas>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="overlay" id="startOverlay">
          <div class="card title-card" role="dialog" aria-labelledby="titleHeading">
            <h2 id="titleHeading">Merge It!</h2>
            <p id="titleTagline">Drop U.S. states into the box. Neighbors stick together. Build the Lower 48.</p>
            <button id="titlePrimary" class="primary">Start Tutorial</button>
            <button id="titleSecondary" class="secondary">Skip</button>
          </div>
        </div>
        <div class="tut-card" id="tutCard" role="dialog" aria-live="polite" aria-labelledby="tutTitle" hidden>
          <div class="tut-head">
            <small id="tutStep"></small><button id="tutSkip" class="linkbtn">Skip tutorial</button>
          </div>
          <h2 id="tutTitle"></h2>
          <p id="tutText"></p>
          <button id="tutNext" hidden>Next</button>
        </div>
        <div class="overlay" id="bankOverlay" hidden>
          <div class="card" role="dialog" aria-labelledby="bankTitle">
            <h2 id="bankTitle">Bank this piece?</h2>
            <p id="bankText"></p>
            <div class="row">
              <button id="bankNo" class="secondary">No</button><button id="bankYes">Yes, bank it</button>
            </div>
          </div>
        </div>
        <div class="overlay win" id="winOverlay" hidden>
          <div class="card" role="dialog" aria-labelledby="winTitle">
            <h2 id="winTitle">You win!</h2>
            <p class="lbl" id="winRoundLbl">Round 1 score</p>
            <div class="big" id="winRoundScore">0</div>
            <p class="total" id="winTotal"></p>
            <div class="row">
              <button id="restartBtn" class="secondary">Restart</button
              ><button id="endlessBtn" class="endless">Endless mode</button>
            </div>
          </div>
        </div>
        <div class="overlay" id="overOverlay" hidden>
          <div class="card">
            <h2 id="overTitle">The box overflowed</h2>
            <p id="overText"></p>
            <button id="againBtn">Play again</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="giveUpBtn" class="secondary stack" disabled>
          <span>Give up</span><span aria-hidden="true">Are you sure?</span>
        </button>
        <button id="shakeBtn" disabled>Shake the box</button>
        <button id="blendBtn" class="blend" disabled title="3 per round: lid on, spin the box to shuffle everything">
          Blend It! (3)
        </button>
      </div>
      <div class="mappreview" id="mapPreview" hidden>
        <div class="mappreview-text">
          <small>Finished map</small>
          <small class="key"><span class="swatch" aria-hidden="true"></span>Current piece</small>
        </div>
        <canvas id="previewCanvas" aria-label="The finished map, with the current piece in gold"></canvas>
      </div>
    </main>
    <div class="tut-dim" id="tutDim" hidden></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
